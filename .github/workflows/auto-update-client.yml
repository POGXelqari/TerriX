name: Upstream Sync & Client Auto-Update

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "client-sync"
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (for syntax validation)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TerriX Client Upstream Check & Build
        run: |
          python -X utf8 scripts/build_client.py --check-upstream

      - name: Commit & Push Changes if Updated
        run: |
          if [ -n "$(git status --porcelain client/ territorial_latest_raw.js territorial_deobfuscated_latest.js)" ]; then
            echo "Upstream update or mod change detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add client/ territorial_latest_raw.* territorial_deobfuscated_latest.* territorial_latest_strings.json
            git commit -m "chore(client): auto-update TerriX client from upstream territorial.io"
            # Pull with rebase, favouring our changes on any timestamp conflicts
            git pull --rebase -X ours origin main || git rebase --abort
            git push origin main
          else
            echo "Client is already up-to-date with upstream. No changes to commit."
          fi
