name: Upstream Sync & Client Auto-Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: "client-sync"
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Check Upstream Hash & Trigger Build
        id: build_step
        run: |
          node scripts/upstream_checker.js
          npm run build

      - name: Execute Headless Verification Gate
        run: |
          node tests/smoke-test.js

      - name: Promote Build to Client Directory
        run: |
          rm -rf client/
          cp -r build/ client/

      - name: Atomic Commit and Push
        run: |
          if [ -n "$(git status --porcelain client/ version.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add client/ version.json
            git commit -m "chore(sync): automated build against territorial.io $(cat version.json | jq -r .upstream_version)"
            
            # Atomic push with strict rejection handling
            git fetch origin main
            git rebase origin/main
            git push origin main
          else
            echo "Zero changes detected. Upstream and client match."
          fi

      - name: File Incident Report on Pipeline Break
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let version = 'unknown';
            try { version = JSON.parse(fs.readFileSync('./version.json')).upstream_version; } catch(e){}
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Upstream Sync Failure: Territorial.io Engine Update ${version}`,
              body: `### Pipeline Failure Report\nThe automated upstream sync pipeline failed during patch application or smoke testing.\n\n**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n**Step:** \`${context.job}\`\n**Safety Action Taken:** Deployment to \`client/\` was aborted. Existing client build was preserved.\n\nPlease review minifier token changes and update \`patches/\` accordingly.`
            });
