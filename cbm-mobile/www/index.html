<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clan Bank Manager (CBM)</title>
  <meta name="theme-color" content="#080d16">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #080d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 112, 224, 0.2);
      border-top-color: #0070e0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      font-size: 15px;
      font-weight: 600;
      color: #9aa8be;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="text">Connecting to Clan Bank Manager...</div>
  <script>
    window.location.replace("https://cbm.wispbyte.org/cbm.html");
  </script>
</body>
</html>
