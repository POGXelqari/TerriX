<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBM Product Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .cbm-card {
      background: linear-gradient(145deg, #00172e 0%, #002244 100%);
      border: 1px solid rgba(0, 112, 186, 0.35);
      border-radius: 14px;
      padding: 20px;
      color: #f6f9fc;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 1px 1px rgba(0, 112, 186, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .cbm-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55), 0 0 12px rgba(0, 112, 186, 0.35);
      border-color: rgba(0, 112, 186, 0.6);
    }
    .cbm-thumb-wrap {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      overflow: hidden;
      background: #001224;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cbm-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cbm-thumb-placeholder {
      font-size: 42px;
      color: #0070ba;
      user-select: none;
    }
    .cbm-badge-strip {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 23, 46, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(0, 207, 146, 0.4);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      color: #00cf92;
    }
    .cbm-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 6px 0;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cbm-desc {
      font-size: 12px;
      color: #a3b8cc;
      margin: 0 0 12px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 34px;
    }
    .cbm-price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 8px 10px;
      background: rgba(0, 18, 36, 0.6);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cbm-price-label {
      font-size: 11px;
      font-weight: 600;
      color: #8898aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cbm-price-val {
      font-size: 17px;
      font-weight: 800;
      color: #ffb800;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cbm-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 16px;
      background: linear-gradient(135deg, #0070ba 0%, #005a96 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(0, 112, 186, 0.35);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .cbm-btn:hover {
      background: linear-gradient(135deg, #0084dd 0%, #0066ab 100%);
      transform: translateY(-1px);
    }
    .cbm-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 11px;
      color: #627b9b;
    }
    .cbm-footer a {
      color: #8898aa;
      text-decoration: none;
    }
    .cbm-footer a:hover {
      color: #00cf92;
      text-decoration: underline;
    }
    .cbm-loading, .cbm-error {
      padding: 40px 20px;
      text-align: center;
      font-size: 13px;
      color: #a3b8cc;
    }
  </style>
</head>
<body>
  <div id="widget-root">
    <div class="cbm-card">
      <div class="cbm-loading">Loading product...</div>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var productId = params.get('id') || params.get('product_id');
      var root = document.getElementById('widget-root');

      if (!productId) {
        root.innerHTML = '<div class="cbm-card"><div class="cbm-error">&#9888; Missing product ID</div></div>';
        return;
      }

      function formatGold(num) {
        return Number(num || 0).toLocaleString('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      fetch('/api/v1/products/' + encodeURIComponent(productId))
        .then(function (res) {
          if (!res.ok) throw new Error('Product not available');
          return res.json();
        })
        .then(function (data) {
          var p = data.product || data;
          var checkoutUrl = '/product.html?id=' + encodeURIComponent(p.product_id || productId);
          var imgUrl = p.image_url;

          var imageHtml = imgUrl
            ? '<img src="' + escapeHtml(imgUrl) + '" alt="' + escapeHtml(p.name) + '" class="cbm-thumb" onerror="this.onerror=null;this.parentElement.innerHTML=\'<div class=\\\'cbm-thumb-placeholder\\\'>&#128230;</div>\';">'
            : '<div class="cbm-thumb-placeholder">&#128230;</div>';

          root.innerHTML = [
            '<div class="cbm-card">',
            '  <div class="cbm-thumb-wrap">',
            '    ' + imageHtml,
            '    <div class="cbm-badge-strip">&#10003; 50% Reserve Cushion</div>',
            '  </div>',
            '  <h3 class="cbm-title" title="' + escapeHtml(p.name) + '">' + escapeHtml(p.name) + '</h3>',
            '  <p class="cbm-desc" title="' + escapeHtml(p.description || '') + '">' + escapeHtml(p.description || 'Exclusive game item or service.') + '</p>',
            '  <div class="cbm-price-row">',
            '    <span class="cbm-price-label">Price</span>',
            '    <span class="cbm-price-val"><span>' + formatGold(p.price_gold) + '</span> <span style="font-size:11px;color:#f6f9fc;">GOLD</span></span>',
            '  </div>',
            '  <button class="cbm-btn" id="buy-btn">',
            '    <span>Buy with CBM Gold</span>',
            '    <span>&rarr;</span>',
            '  </button>',
            '  <div class="cbm-footer">',
            '    <span>Secured by</span>',
            '    <a href="/rulebook.html" target="_blank">Clan Bank Manager</a>',
            '  </div>',
            '</div>'
          ].join('\n');

          document.getElementById('buy-btn').addEventListener('click', function () {
            try {
              if (window.top && window.top !== window) {
                window.top.location.href = checkoutUrl;
              } else {
                window.location.href = checkoutUrl;
              }
            } catch (e) {
              window.open(checkoutUrl, '_blank');
            }
          });
        })
        .catch(function (err) {
          root.innerHTML = '<div class="cbm-card"><div class="cbm-error">&#9888; ' + escapeHtml(err.message) + '</div></div>';
        });
    })();
  </script>
</body>
</html>
