<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TerriX Scenario Studio</title>
  <meta name="description" content="Scenario Creator and Cartography Studio for TerriX Client">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="studio.css?1791583427145">
</head>
<body>
  <div class="app-container">
    <!-- Top Header Bar -->
    <header class="header-bar">
      <div class="brand-section">
        <span class="brand-logo">TerriX Studio</span>
        <div class="workspace-switcher">
          <button class="workspace-tab active" data-workspace="cartography">Cartography</button>
          <button class="workspace-tab" data-workspace="scenario">Scenario Architect</button>
        </div>
        <!-- Cross-Tab Connection Telemetry Status -->
        <div id="clientConnectionStatus" style="display: flex; align-items: center; gap: 8px; margin-left: 16px; font-size: 12px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#64748b;"></span>
          <span style="color:#94a3b8; font-weight:500;">Client Offline</span>
        </div>
      </div>

      <div class="header-actions">
        <input type="file" id="fileInputJson" accept=".json" style="display: none;">
        <button id="btnUndo" class="studio-btn" title="Undo (Ctrl+Z)">↶</button>
        <button id="btnRedo" class="studio-btn" title="Redo (Ctrl+Y)">↷</button>
        <button id="btnNewScenario" class="studio-btn" title="Create new blank scenario">New</button>
        <button id="btnPullGame" class="studio-btn" title="Pull active match snapshot from game tab">📥 Pull State</button>
        <button id="btnImportJson" class="studio-btn" title="Load tt_scenario.json">Import</button>
        <button id="btnExportJson" class="studio-btn" title="Download tt_scenario.json">Export</button>
        <button id="btnShareLink" class="studio-btn" title="Copy shareable URL hash link">Share</button>
        <button id="btnLaunchGame" class="studio-btn btn-launch" title="Launch scenario in TerriX client">▶ Launch in Game</button>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="main-workspace">
      <!-- Left Tool Palette Dock -->
      <aside class="tool-dock">
        <button class="tool-btn active" data-tool="brush" title="Standard Brush">✏️</button>
        <button class="tool-btn" data-tool="claim" title="Claim Brush (Paint Player Territory)">👑</button>
        <button class="tool-btn" data-tool="fractal" title="Fractal Coastline Brush">🌊</button>
        <button class="tool-btn" data-tool="fill" title="Flood Fill">🪣</button>
        <button class="tool-btn" data-tool="spawn" title="Place Player Spawn Node">📍</button>
        <button class="tool-btn" data-tool="eraser" title="Eraser (Ocean Water)">🧹</button>

        <div class="tool-divider"></div>

        <button class="tool-btn active" data-terrain="1" title="Neutral Land" style="color: #10b981;">🟩</button>
        <button class="tool-btn" data-terrain="2" title="Shallow Water / River" style="color: #3b82f6;">🟦</button>
        <button class="tool-btn" data-terrain="5" title="Impassable Mountain" style="color: #64748b;">⛰️</button>
      </aside>

      <!-- Center Canvas Viewport -->
      <section class="canvas-viewport" id="viewportContainer">
        <canvas id="viewportCanvas" class="viewport-canvas"></canvas>
        <canvas id="viewportOverlay" class="viewport-overlay"></canvas>
      </section>

      <!-- Right Inspector Panel -->
      <aside class="inspector-panel">
        <div class="inspector-tabs">
          <button class="inspector-tab active" data-tab="map">Map</button>
          <button class="inspector-tab" data-tab="scenario">Scenario</button>
          <button class="inspector-tab" data-tab="roster">Roster</button>
          <button class="inspector-tab" data-tab="diplomacy">Diplomacy</button>
          <button class="inspector-tab" data-tab="economy">Economy</button>
          <button class="inspector-tab" data-tab="topology">Topology</button>
        </div>

        <div class="inspector-content">
          <div id="panelMapTools"></div>
          <div id="panelScenarioProps" style="display: none;"></div>
          <div id="panelRoster" style="display: none;"></div>
          <div id="panelDiplomacy" style="display: none;"></div>
          <div id="panelEconomy" style="display: none;"></div>
          <div id="panelTopology" style="display: none;"></div>
        </div>
      </aside>
    </main>

    <!-- Footer Status Bar -->
    <footer class="status-bar">
      <div class="status-group">
        <span id="statusCoords">X: 0 | Y: 0</span>
        <span id="statusTileType">Tile: Land</span>
      </div>
      <div class="status-group">
        <span id="statusDim">Dim: 1024 × 1024</span>
        <span>Canvas 2D Stacked Pipeline</span>
      </div>
    </footer>
  </div>

  <script src="studio.bundle.js?1791583427145"></script>
</body>
</html>
